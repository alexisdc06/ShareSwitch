# Tag a commit "vX.Y.Z" and push it -> this builds the exe + installer and
# publishes a GitHub Release with both files attached.
#
#   git tag v0.2.0
#   git push origin v0.2.0

name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Derive version from tag
        id: ver
        shell: pwsh
        run: '"version=$($env:GITHUB_REF_NAME.TrimStart(''v''))" >> $env:GITHUB_OUTPUT'

      - name: Publish single-file exe
        run: dotnet publish ShareSwitch.csproj -c Release -o publish -p:Version=${{ steps.ver.outputs.version }}

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=${{ steps.ver.outputs.version }}" installer\ShareSwitch.iss

      - name: Rename portable exe
        shell: pwsh
        run: Copy-Item publish\ShareSwitch.exe "publish\ShareSwitch-${{ steps.ver.outputs.version }}-portable.exe"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/ShareSwitch-${{ steps.ver.outputs.version }}-portable.exe
            installer/Output/ShareSwitch-Setup-${{ steps.ver.outputs.version }}.exe
