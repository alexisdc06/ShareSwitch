# Free automated security analysis for public repos.
# Findings appear under the repo's "Security" tab.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly, catches newly-published rules

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          queries: security-and-quality

      - name: Build
        run: dotnet build ShareSwitch.csproj -c Release

      - uses: github/codeql-action/analyze@v3
