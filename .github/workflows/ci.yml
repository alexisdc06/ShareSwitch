name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build (warnings are errors)
        run: dotnet build ShareSwitch.csproj -c Release -warnaserror

      - name: Verify formatting
        run: dotnet format ShareSwitch.csproj --verify-no-changes --severity warn
        continue-on-error: true # advisory for now; flip to blocking once the codebase is clean
