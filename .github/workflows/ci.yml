name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build ShareSwitch.csproj -c Release

      # Advisory quality gates. Kept non-blocking so a style nit never stops a
      # release going out; tighten to blocking once the codebase is warning-clean.
      - name: Analyzer warnings (advisory)
        run: dotnet build ShareSwitch.csproj -c Release --no-incremental -warnaserror
        continue-on-error: true

      - name: Formatting (advisory)
        run: dotnet format ShareSwitch.csproj --verify-no-changes --severity warn
        continue-on-error: true
